   name: Validar planos de tagueamento

   on:
     pull_request:
       paths: ['plans/**', 'examples/**', 'app/rules.js']
     push:
       branches: [main]
       paths: ['plans/**', 'examples/**', 'app/rules.js']

   jobs:
     validate:
       runs-on: ubuntu-latest
       steps:
         - uses: actions/checkout@v4
         - uses: actions/setup-node@v4
           with:
             node-version: 20
         - run: node scripts/validate.js
